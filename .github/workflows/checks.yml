name: Stable v0.1.5 checks (no BMW SDK)
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original code and package verification
        run: |
          node tests/blend.test.js
          node tests/fuel_obd.test.js
          node --check apps/ethanol_mix/main.js
          python tests/test_store_metadata.py
          python tests/test_store_output_contract.py
          python tests/test_software_fallback.py
