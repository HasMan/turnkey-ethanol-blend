name: Source checks (no BMW SDK)
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculator tests
        run: |
          node tests/blend.test.js
          node tests/fuel_obd.test.js
          python tests/test_store_metadata.py
      - name: Syntax checks
        run: |
          node --check apps/ethanol_mix/main.js
          python -m py_compile tools/build_store.py kit/tools/build.py
